<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文ごっこアプリ</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      background-color: #fff8e7;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      font-size: 1.2rem;
      padding: 15px 30px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background-color: #ff5252; }
    .status { margin-top: 15px; font-weight: bold; color: #666; }
    .response { font-size: 1.4rem; margin: 20px 0; color: #333; }
  </style>
</head>
<body>

<div class="card">
  <h1>🍧 お店やさんごっこ</h1>
  <p class="response" id="aiText">「スタート」を押してね！</p>
  
  <button id="startBtn">スタート！</button>
  <div class="status" id="statusText"></div>
</div>

<script>
  // 音声認識の準備
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    alert("お使いのブラウザは音声認識に対応していません。Google Chromeなどでお試しください。");
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false; // 途中の認識結果は取得しない

  // 味のキーワードリスト
  const flavors = ["いちご", "ストロベリー", "メロン", "レモン", "ブルーハワイ", "チョコ", "バニラ", "ぶどう"];

  const aiText = document.getElementById('aiText');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');

  // AIが話す関数
  function speak(text, onEndCallback) {
    aiText.textContent = text;
    window.speechSynthesis.cancel(); // 前の発話をキャンセル

    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'ja-JP';
    uttr.rate = 0.9; // 子供が聞き取りやすいよう少しゆっくり

    if (onEndCallback) {
      uttr.onend = onEndCallback;
    }

    window.speechSynthesis.speak(uttr);
  }

  // 「スタート」ボタンを押したときの処理
  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none'; // スタートボタンを隠す
    
    // 店員の最初のあいさつ
    speak("いらっしゃいませ！何味にしますか？", () => {
      // 話し終わったらマイクの聞き取りを開始
      startListening();
    });
  });

  // 音声聞き取りの開始
  function startListening() {
    statusText.textContent = "🎤 はなしてね...";
    try {
      recognition.start();
    } catch (e) {
      // 既に実行中の場合などのエラー回避
    }
  }

  // 音声を認識できたとき
  recognition.onresult = (event) => {
    const userSpeech = event.results[0][0].transcript;
    statusText.textContent = `「${userSpeech}」と言ったよ`;

    // 言葉の中から味を探す
    let foundFlavor = null;
    for (const flavor of flavors) {
      if (userSpeech.includes(flavor)) {
        foundFlavor = flavor;
        break;
      }
    }

    if (foundFlavor) {
      // 味を聞き取れた場合
      speak(`${foundFlavor}味ですね。少々お待ちください！`, () => {
        statusText.textContent = "✨ 注文完了！";
      });
    } else {
      // 聞き取れなかった・味が含まれていなかった場合
      speak("うまく聞き取れませんでした。もう一度お願いします！", () => {
        startListening(); // 再度聞き取り
      });
    }
  };

  // 音声認識でエラーが起きたとき・無音だったとき
  recognition.onerror = (event) => {
    statusText.textContent = "";
    speak("もう一度お願いします！", () => {
      startListening();
    });
  };
</script>

</body>
</html>
