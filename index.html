<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文ごっこアプリ</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      background-color: #fff8e7;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      font-size: 1.2rem;
      padding: 15px 30px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px 5px;
      box-shadow: 0 4px 0 #e04848;
    }
    button:disabled {
      background-color: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    .mic-btn {
      background-color: #4ecdc4;
      box-shadow: 0 4px 0 #3b9b94;
    }
    .status { margin-top: 15px; font-weight: bold; font-size: 1.1rem; }
    .response { font-size: 1.5rem; margin: 20px 0; color: #333; min-height: 2em; font-weight: bold; }
    
    .ice-container {
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ice-icon {
      font-size: 80px;
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.5s ease;
    }
    .ice-icon.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🍧 お店やさんごっこ</h1>
  <p class="response" id="aiText">「スタート」を押してね！</p>

  <div class="ice-container">
    <span id="iceIcon" class="ice-icon">🍧</span>
  </div>
  
  <div>
    <button id="startBtn">スタート！</button>
    <button id="micBtn" class="mic-btn" style="display:none;">🎤 おはなしする</button>
  </div>
  
  <div class="status" id="statusText"></div>
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    alert("Google Chrome または Microsoft Edge でお試しください。");
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true; // 喋っている途中のリアルタイム認識を有効化
  recognition.continuous = false;

  const flavorMap = {
    "いちご": "🍧", "ストロベリー": "🍧", "メロン": "🍧", 
    "レモン": "🍧", "ブルーハワイ": "🍧", "チョコ": "🍫", "バニラ": "🍦", "ぶどう": "🍇"
  };

  const aiText = document.getElementById('aiText');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');
  const micBtn = document.getElementById('micBtn');
  const iceIcon = document.getElementById('iceIcon');

  let isListening = false;

  // スタートボタン
  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none';
    iceIcon.classList.remove('show');
    
    aiText.textContent = "「いらっしゃいませ！何味にしますか？」";
    micBtn.style.display = 'inline-block';
    statusText.style.color = "#666";
    statusText.textContent = "「おはなしする」を押して話しかけてね！";
  });

  // おはなしするボタン
  micBtn.addEventListener('click', () => {
    if (isListening) return;

    try {
      recognition.start();
    } catch (e) {
      console.log("Start error:", e);
    }
  });

  // マイクの起動状態
  recognition.onstart = () => {
    isListening = true;
    micBtn.disabled = true;
    statusText.style.color = "#ff6b6b";
    statusText.textContent = "🔴 きいているよ…";
  };

  // リアルタイム・最終音声認識
  recognition.onresult = (event) => {
    let interimTranscript = '';
    let finalTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript;
      } else {
        interimTranscript += event.results[i][0].transcript;
      }
    }

    // 喋っている途中でも画面に文字を表示（反応しているか確認できるようにする）
    const currentText = finalTranscript || interimTranscript;
    statusText.style.color = "#333";
    statusText.textContent = `「${currentText}」`;

    // 味の判定（最終結果が出たとき）
    if (finalTranscript) {
      let foundFlavor = null;
      for (const flavor in flavorMap) {
        if (finalTranscript.includes(flavor)) {
          foundFlavor = flavor;
          break;
        }
      }

      if (foundFlavor) {
        micBtn.style.display = 'none';
        aiText.textContent = `「${foundFlavor}味ですね。少々お待ちください！」`;

        setTimeout(() => {
          iceIcon.textContent = flavorMap[foundFlavor];
          iceIcon.classList.add('show');
          aiText.textContent = "「はいどうぞ！召し上がれ！」";
          
          startBtn.textContent = "もう一度あそぶ";
          startBtn.style.display = "inline-block";
        }, 1200);

      } else {
        aiText.textContent = "「うまく聞き取れなかったよ。もう一回教えてね！」";
      }
    }
  };

  // マイク認識終了時
  recognition.onend = () => {
    isListening = false;
    micBtn.disabled = false;
    if (micBtn.style.display !== 'none' && !statusText.textContent.includes("と言った")) {
      statusText.style.color = "#666";
      statusText.textContent = "「おはなしする」を押してもう一度喋ってね！";
    }
  };

  // エラー時
  recognition.onerror = (event) => {
    console.error("Error:", event.error);
    isListening = false;
    micBtn.disabled = false;
    statusText.style.color = "#ff5252";
    
    if (event.error === 'no-speech') {
      statusText.textContent = "声が聞こえなかったよ。ボタンを押してもう一度喋ってね！";
    } else if (event.error === 'not-allowed') {
      statusText.textContent = "⚠️ マイクがブロックされています";
    } else {
      statusText.textContent = "エラーが発生しました。もう一度試してね。";
    }
  };
</script>

</body>
</html>
