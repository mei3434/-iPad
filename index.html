<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文練習</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      background-color: #fff8e7;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }
    button {
      font-size: 1.2rem;
      padding: 15px 30px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 0 #e04848;
    }
    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e04848;
    }
    .status { margin-top: 15px; font-weight: bold; color: #666; }
    .response { font-size: 1.4rem; margin: 20px 0; color: #333; min-height: 2em; }
    
    /* --- 追加：かき氷表示エリアとアニメーション --- */
    .ice-container {
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }
    .ice-icon {
      font-size: 100px;
      display: inline-block;
      opacity: 0;
      transform: scale(0.3) rotate(-10deg);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* ポップにはねるアニメーション */
    }
    /* 完成した時に付与するクラス */
    .ice-icon.show {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🍧 お店やさんごっこ</h1>
  <p class="response" id="aiText">「スタート」を押してね！</p>

  <!-- かき氷のイラスト表示エリア -->
  <div class="ice-container">
    <span id="iceIcon" class="ice-icon">🍧</span>
  </div>
  
  <button id="startBtn">スタート！</button>
  <div class="status" id="statusText"></div>
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    alert("お使いのブラウザは音声認識に対応していません。Google Chromeなどでお試しください。");
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;

  // 味とアイコンの対応表（拡張しやすいようにオブジェクト形式に変更）
  const flavorMap = {
    "いちご": "🍧",
    "ストロベリー": "🍧",
    "メロン": "🍧",
    "レモン": "🍧",
    "ブルーハワイ": "🍧",
    "チョコ": "🍫",
    "バニラ": "🍦",
    "ぶどう": "🍇"
  };

  const aiText = document.getElementById('aiText');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');
  const iceIcon = document.getElementById('iceIcon');

  // AIが話す関数
  function speak(text, onEndCallback) {
    aiText.textContent = text;
    window.speechSynthesis.cancel();

    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'ja-JP';
    uttr.rate = 0.9;

    if (onEndCallback) {
      uttr.onend = onEndCallback;
    }

    window.speechSynthesis.speak(uttr);
  }

  // スタートボタン
  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none';
    iceIcon.classList.remove('show'); // かき氷を隠す
    
    speak("いらっしゃいませ！何味にしますか？", () => {
      startListening();
    });
  });

  // 音声聞き取り開始
  function startListening() {
    statusText.textContent = "🎤 はなしてね...";
    try {
      recognition.start();
    } catch (e) {}
  }

  // 音声認識成功時
  recognition.onresult = (event) => {
    const userSpeech = event.results[0][0].transcript;
    statusText.textContent = `「${userSpeech}」と言ったよ`;

    let foundFlavor = null;
    for (const flavor in flavorMap) {
      if (userSpeech.includes(flavor)) {
        foundFlavor = flavor;
        break;
      }
    }

    if (foundFlavor) {
      // 1. まず「少々お待ちください」と喋る
      speak(`${foundFlavor}味ですね。少々お待ちください！`, () => {
        
        // 2. 喋り終わったらアニメーション付きでイラストを表示！
        iceIcon.textContent = flavorMap[foundFlavor]; // 味に応じたアイコン設定
        iceIcon.classList.add('show'); // CSSアニメーション発動

        // 3. 「お待たせしました！」と仕上げのセリフ
        setTimeout(() => {
          speak("はいどうぞ！召し上がれ！", () => {
            statusText.textContent = "✨ 注文完了！";
            
            // 3秒後に「もう一度あそぶ」ボタンを出す
            setTimeout(() => {
              startBtn.textContent = "もういちど遊ぶ";
              startBtn.style.display = "inline-block";
            }, 1000);
          });
        }, 500);

      });
    } else {
      speak("うまく聞き取れませんでした。もう一度お願いします！", () => {
        startListening();
      });
    }
  };

  // エラー時
  recognition.onerror = () => {
    statusText.textContent = "";
    speak("もう一度お願いします！", () => {
      startListening();
    });
  };
</script>

</body>
</html>
