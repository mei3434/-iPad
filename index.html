<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文ごっこアプリ</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      background-color: #fff8e7;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      font-size: 1.2rem;
      padding: 15px 30px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px 5px;
      box-shadow: 0 4px 0 #e04848;
    }
    button:disabled {
      background-color: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    .mic-btn {
      background-color: #4ecdc4;
      box-shadow: 0 4px 0 #3b9b94;
    }
    .status { margin-top: 15px; font-weight: bold; color: #666; }
    .response { font-size: 1.4rem; margin: 20px 0; color: #333; min-height: 2em; }
    
    .ice-container {
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ice-icon {
      font-size: 80px;
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.5s ease;
    }
    .ice-icon.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🍧 お店やさんごっこ</h1>
  <p class="response" id="aiText">「スタート」を押してね！</p>

  <div class="ice-container">
    <span id="iceIcon" class="ice-icon">🍧</span>
  </div>
  
  <div>
    <button id="startBtn">スタート！</button>
    <button id="micBtn" class="mic-btn" style="display:none;">🎤 おはなしする</button>
  </div>
  
  <div class="status" id="statusText"></div>
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    alert("お使いのブラウザは音声認識に対応していません。Google Chrome等でお試しください。");
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;

  const flavorMap = {
    "いちご": "🍧", "ストロベリー": "🍧", "メロン": "🍧", 
    "レモン": "🍧", "ブルーハワイ": "🍧", "チョコ": "🍫", "バニラ": "🍦"
  };

  const aiText = document.getElementById('aiText');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');
  const micBtn = document.getElementById('micBtn');
  const iceIcon = document.getElementById('iceIcon');

  let isSpeaking = false; // AIが話中かどうかのフラグ
  let isListening = false; // 音声認識中かどうかのフラグ

  // AIが喋る処理（音声読み上げ）
  function speak(text, onEndCallback) {
    isSpeaking = true;
    aiText.textContent = text;
    window.speechSynthesis.cancel(); // 喋りを一旦クリア

    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'ja-JP';
    uttr.rate = 0.9;

    uttr.onend = () => {
      isSpeaking = false;
      if (onEndCallback) onEndCallback();
    };

    window.speechSynthesis.speak(uttr);
  }

  // スタートボタン
  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none';
    iceIcon.classList.remove('show');
    statusText.textContent = "";

    speak("いらっしゃいませ！何味にしますか？", () => {
      // 喋り終わったら「おはなしする」ボタンを表示
      micBtn.style.display = 'inline-block';
      statusText.textContent = "「おはなしする」を押して喋ってね！";
    });
  });

  // 「おはなしする」ボタンを押した時だけ音声認識を開始
  micBtn.addEventListener('click', () => {
    if (isSpeaking || isListening) return; // 連打防止

    try {
      recognition.start();
      isListening = true;
      micBtn.disabled = true;
      statusText.textContent = "🎤 きいているよ...（はなしてね）";
    } catch (e) {
      console.log(e);
    }
  });

  // 音声を認識できたとき
  recognition.onresult = (event) => {
    isListening = false;
    micBtn.disabled = false;
    
    const userSpeech = event.results[0][0].transcript;
    statusText.textContent = `「${userSpeech}」と言ったよ`;

    let foundFlavor = null;
    for (const flavor in flavorMap) {
      if (userSpeech.includes(flavor)) {
        foundFlavor = flavor;
        break;
      }
    }

    if (foundFlavor) {
      micBtn.style.display = 'none'; // マイクボタンを隠す
      speak(`${foundFlavor}味ですね。少々お待ちください！`, () => {
        iceIcon.textContent = flavorMap[foundFlavor];
        iceIcon.classList.add('show');

        setTimeout(() => {
          speak("はいどうぞ！召し上がれ！", () => {
            startBtn.textContent = "もう一度あそぶ";
            startBtn.style.display = "inline-block";
          });
        }, 600);
      });
    } else {
      // 味が入っていなかった場合（連呼させず、ボタンを再度押させる）
      speak("うまく聞き取れなかったよ。もう一回教えてね！", () => {
        statusText.textContent = "「おはなしする」を押してもう一度喋ってね！";
      });
    }
  };

  // エラー・無音で終わったとき
  recognition.onerror = (event) => {
    isListening = false;
    micBtn.disabled = false;
    
    // 自動で再実行せず、AIが促してからボタンで再開させる
    speak("うまく聞き取れなかったよ。もう一回教えてね！", () => {
      statusText.textContent = "「おはなしする」を押してもう一度喋ってね！";
    });
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.disabled = false;
  };
</script>

</body>
</html>
